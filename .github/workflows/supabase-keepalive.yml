name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Run every 5 days at 04:00 UTC (cron: minute hour day month day-of-week)
    - cron: '0 4 */5 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase PostgreSQL REST Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Request
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Supabase secrets not configured. Skipping ping."
            exit 0
          fi
          echo "Pinging Supabase REST endpoint to keep project active..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=count" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Supabase ping successful! Free tier will remain awake."
          else
            echo "Supabase ping returned error status: $HTTP_STATUS"
            exit 1
          fi
